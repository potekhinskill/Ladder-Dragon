name: star history

on:
  watch:
    types: [started]
  push:
    branches: [main]
    paths:
      - ".github/workflows/star-history.yml"
      - ".github/star-history-seed.json"
      - "bin/generate_star_history.py"
  schedule:
    # The watch event has no removal action. The daily run reconciles removals
    # and recovers from delayed or missed repository events.
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: star-history-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Generate star history from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAR_HISTORY_STATE_URL: >-
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/star-history.json
        run: >-
          python3 bin/generate_star_history.py
          --repository "${GITHUB_REPOSITORY}"
          --seed-json .github/star-history-seed.json
          --previous-url "${STAR_HISTORY_STATE_URL}"
          --state-output _site/star-history.json
          --output _site/star-history.svg
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
