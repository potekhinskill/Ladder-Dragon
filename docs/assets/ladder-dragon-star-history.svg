<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Ladder Dragon GitHub star history</title>
  <desc id="description">GitHub stars from repository launch on July 18, 2026 through July 26, 2026. The current count is zero.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#21c07a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="300" rx="18" fill="url(#background)"/>
  <rect x="0.5" y="0.5" width="959" height="299" rx="17.5" fill="none" stroke="#29344a"/>

  <text x="44" y="50" fill="#f8fafc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700">GitHub Star History</text>
  <text x="44" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Ladder Dragon · public repository growth</text>
  <text x="892" y="55" text-anchor="end" fill="#f8fafc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="800">0 ★</text>
  <text x="892" y="76" text-anchor="end" fill="#94a3b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">current stars</text>

  <line x1="76" y1="112" x2="76" y2="230" stroke="#334155"/>
  <line x1="76" y1="230" x2="892" y2="230" stroke="#334155"/>
  <line x1="76" y1="112" x2="892" y2="112" stroke="#1e293b" stroke-dasharray="5 7"/>
  <line x1="76" y1="171" x2="892" y2="171" stroke="#1e293b" stroke-dasharray="5 7"/>

  <text x="62" y="116" text-anchor="end" fill="#64748b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">1</text>
  <text x="62" y="234" text-anchor="end" fill="#64748b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">0</text>
  <text x="76" y="256" fill="#64748b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Jul 18</text>
  <text x="892" y="256" text-anchor="end" fill="#64748b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Jul 26, 2026</text>

  <path d="M76 230 H892" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="892" cy="230" r="7" fill="#21c07a" stroke="#d1fae5" stroke-width="2"/>
  <text x="484" y="199" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600">The history starts with the first star</text>
  <text x="484" y="278" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Public GitHub stargazer data · snapshot 2026-07-26</text>
</svg>
